[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "financial_lakehouse"
version = "0.2.0"
description = "Local Delta Lake medallion pipeline producing ML-ready financial time-series and classification datasets."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyspark>=4.0.1,<=4.2.0",
    "delta-spark>=4.4,<4.5",
    "yfinance>=0.2.50",
    "pandas>=2.2",
    "pyarrow>=15",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
notebook = ["jupyter", "matplotlib>=3.8"]

[project.scripts]
financial-lakehouse = "financial_lakehouse.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::ResourceWarning"]
